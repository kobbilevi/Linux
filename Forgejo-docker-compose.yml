version: "3.8"

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:9
    container_name: forgejo-server
    environment:
      - USER_UID=1000
      - USER_GID=1000
    restart: always
    networks:
      - forgejo-network
    volumes:
      - ./forgejo-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "222:22"

  backup:
    image: alpine:latest
    container_name: forgejo-backup
    restart: always
    volumes:
      - ./forgejo-data:/data:ro
      - ./backups:/backups
      - /etc/localtime:/etc/localtime:ro
    entrypoint: |
      /bin/sh -c "
      echo 'Backup script started...';
      while true; do
        sleep 86400;
        FILENAME=\"/backups/forgejo-backup-\$(date +%Y%m%d-%H%M%S).tar.gz\";
        echo \"Starting backup to \${FILENAME}...\";
        tar -czf \${FILENAME} -C / data;
        echo \"Backup finished successfully.\";
        find /backups -type f -mtime +7 -name 'forgejo-backup-*.tar.gz' -delete;
      done
      "

networks:
  forgejo-network:
    driver: bridge
